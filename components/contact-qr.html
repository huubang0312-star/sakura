<div class="contact-qr" role="region" aria-label="Contact via QR code">
  <span class="contact-qr__label">Click to select the QR scanning method.</span>
  <div class="contact-qr__list">
    <a
      class="contact-qr__link"
      href="./assets/images/del/QRcode-telegram.jpg"
      data-title="Telegram"
      aria-label="Open Telegram QR code"
    >
      <img src="./assets/images/del/QRcode-telegram.jpg" alt="Telegram" />
    </a>
    <a
      class="contact-qr__link"
      href="./assets/images/del/QRcode-kakaotalk.jpg"
      data-title="Kakaotalk"
      aria-label="Open Kakaotalk QR code"
    >
      <img src="./assets/images/del/QRcode-kakaotalk.jpg" alt="Kakaotalk" />
    </a>
    <a
      class="contact-qr__link"
      href="./assets/images/del/QRcode-line.jpg"
      data-title="Line"
      aria-label="Open Line QR code"
    >
      <img src="./assets/images/del/QRcode-line.jpg" alt="Line" />
    </a>
    <a
      class="contact-qr__link"
      href="./assets/images/del/QRcode-insta.jpg"
      data-title="Instagram"
      aria-label="Open Instagram QR code"
    >
      <img src="./assets/images/del/QRcode-insta.jpg" alt="Instagram" />
    </a>
    <a
      class="contact-qr__link"
      href="./assets/images/del/QRcode-wechat.jpg"
      data-title="Wechat"
      aria-label="Open Wechat QR code"
    >
      <img src="./assets/images/del/QRcode-wechat.jpg" alt="Wechat" />
    </a>
  </div>
</div>
